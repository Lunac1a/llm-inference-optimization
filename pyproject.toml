[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-service"
version = "0.1.4"
description = "Qwen3-4B inference service with mixed-precision KV cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi==0.136.3", "httpx==0.28.1", "pydantic==2.13.5", "uvicorn==0.52.4"]

[project.optional-dependencies]
runtime = ["vllm==0.23.0", "transformers==4.57.6"]

[project.scripts]
inference-api = "inference_service.cli:main"

[project.entry-points."vllm.general_plugins"]
inference_hybrid_prefill = "inference_service.plugins:register_hybrid"
inference_chunked_prefill = "inference_service.plugins:register_chunked"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inference_service.backends" = ["UPSTREAM_NOTICE.txt", "APACHE-2.0.txt"]
